site_name: GradInf

theme:
  name: 'material'
  home: index
  toc_depth: 2
  features:
    - content.code.copy
    - navigation.expand
  logo: images/logo-white.png
  palette:
    primary: black

nav:
  - Home: index.md
  - Examples:
    - Differentiating a Queue Model: examples/QueueModel.md
    - Estimating Greeks of Option Pricing Model: examples/OptionPricing.md
    - Parameter Inference of Gene Transcription Model: examples/GeneTranscription.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - overrides.js

extra_css:
  - overrides.css
