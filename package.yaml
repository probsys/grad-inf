name:                grad-inf
version:             0.1.0.0
github:              "probsys/grad-inf"
license:             Apache-2.0
author:              "Gaurav Arya"
maintainer:          "gauravar@cmu.edu"
copyright:           "Copyright (c) 2026"

extra-source-files:
- README.md

description:         Please see the README on GitHub at <https://github.com/probsys/grad-inf#readme>

dependencies:
- base >= 4.7 && < 5
- monad-bayes ==1.3.0.4
- mtl >=2.2.2
- ad >=4.5.2
- reflection >=2.1.6 && <3
- transformers >=0.5.6.2
- vector >=0.12.3.1
- monad-coroutine >= 0.9.2
- random-fu >= 0.3.0.0
- random ==1.2.1.3
- backprop >= 0.2.7.2
- matrix >= 0.3.6.4
- hmatrix >= 0.20.2
- statistics >= 0.16.3.0

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -Wno-noncanonical-monad-instances

library:
  source-dirs: src
  default-extensions:
    - FlexibleContexts
    - FlexibleInstances
    - FunctionalDependencies
    - ImportQualifiedPost
    - ImpredicativeTypes
    - QuantifiedConstraints
    - ScopedTypeVariables
    - TypeFamilies
    - UndecidableInstances
    - ConstraintKinds
    - TypeOperators
    - StandaloneDeriving
    - DeriveGeneric
    - DeriveAnyClass
    - DuplicateRecordFields
    - DerivingStrategies
    - GeneralizedNewtypeDeriving

executables:
  QueueModelTutorial:
    main:                QueueModel.lhs
    source-dirs:         tutorials
    other-modules: []
    ghc-options:
    - -main-is undefined
    dependencies:
    - grad-inf
  OptionPricingTutorial:
    main:                OptionPricing.lhs
    source-dirs:         tutorials
    other-modules: []
    ghc-options:
    - -main-is undefined
    dependencies:
    - grad-inf
  GeneTranscriptionTutorial:
    main:                GeneTranscription.lhs
    source-dirs:         tutorials
    other-modules: []
    ghc-options:
    - -main-is undefined
    dependencies:
    - grad-inf
tests:
  doctest-queue-model:
    main:              Doctests.hs
    source-dirs:       test
    ghc-options:
      - -main-is docTestQueueModel
    dependencies:
      - markdown-unlit
      - doctest
  doctest-option-pricing:
    main:              Doctests.hs
    source-dirs:       test
    ghc-options:
      - -main-is docTestOptionPricing
    dependencies:
      - markdown-unlit
      - doctest
  doctest-gene-transcription:
    main:              Doctests.hs
    source-dirs:       test
    ghc-options:
      - -main-is docTestGeneTranscription
    dependencies:
      - markdown-unlit
      - doctest
