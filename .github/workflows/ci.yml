name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BLAS/LAPACK (required by hmatrix)
        run: sudo apt-get update && sudo apt-get install -y libblas-dev liblapack-dev

      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'package.yaml') }}
          restore-keys: ${{ runner.os }}-stack-

      - name: Build and run doctests
        run: stack test
